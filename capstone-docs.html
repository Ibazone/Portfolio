<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dormio Capstone</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #141414;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .top-buttons {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .top-buttons a {
            padding: 10px 18px;
            margin-right: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-main {
            background: red;
            color: white;
        }

        .btn-outline {
            border: 1px solid white;
            color: white;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 40px;
        }

        .doc-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .doc-card {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            width: 200px;
            transition: 0.3s;
        }

        .doc-card:hover {
            transform: scale(1.05);
            background: #333;
        }

        .doc-card a {
            text-decoration: none;
            color: white;
        }

        .doc-title {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<!-- TOP BUTTONS -->
<div class="top-buttons">
    <a href="F24_T12_Project_Summary.docx.pdf" target="_blank" class="btn-main">Summary</a>
    <a href="F24_T12-Project_Vision.docx.pdf" target="_blank" class="btn-outline">Vision</a>
</div>

<div class="container">
    <h1>Dormio Capstone Project</h1>

    <div class="doc-grid">

        <div class="doc-card">
            <a href="F24_T12_Project_Summary.docx.pdf" target="_blank">
                📄
                <div class="doc-title">Project Summary</div>
            </a>
        </div>

        <div class="doc-card">
            <a href="F24_T12-Project_Vision.docx.pdf" target="_blank">
                📘
                <div class="doc-title">Project Vision</div>
            </a>
        </div>

        <div class="doc-card">
            <a href="F24-T12-Project Plan.docx.pdf" target="_blank">
                📊
                <div class="doc-title">Project Plan</div>
            </a>
        </div>

        <div class="doc-card">
            <a href="F24-T12-Sprint Backlog.pdf" target="_blank">
                📋
                <div class="doc-title">Sprint Backlog</div>
            </a>
        </div>

        <div class="doc-card">
            <a href="F24-T12-Dormio-Presentation.pdf" target="_blank">
                🎤
                <div class="doc-title">Presentation</div>
            </a>
        </div>

    </div>
</div>

</body>
</html>
