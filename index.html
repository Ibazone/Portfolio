<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home-body">
  <div class="bg-overlay"></div>

  <section class="intro-screen">
    <p class="intro-subtitle fade-in">Welcome</p>
    <h1 class="intro-title fade-in">My Portfolio</h1>
    <p class="intro-text fade-in">
      Select a section to explore my academic work, background, experience, and contact information.
    </p>

    <div class="profile-grid">
      <a href="work.html" class="profile-card fade-up" style="animation-delay: 0.1s;">
        <div class="profile-icon red">W</div>
        <span>Work</span>
      </a>

      <a href="about.html" class="profile-card fade-up" style="animation-delay: 0.2s;">
        <div class="profile-icon blue">A</div>
        <span>About</span>
      </a>

      <a href="resume.html" class="profile-card fade-up" style="animation-delay: 0.3s;">
        <div class="profile-icon green">R</div>
        <span>Resume</span>
      </a>

      <a href="education.html" class="profile-card fade-up" style="animation-delay: 0.4s;">
        <div class="profile-icon yellow">E</div>
        <span>Education</span>
      </a>

      <a href="contact.html" class="profile-card fade-up" style="animation-delay: 0.5s;">
        <div class="profile-icon purple">C</div>
        <span>Contact</span>
      </a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
